<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three.module.js",
        "three/addons/": "/vendor/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="scene-container"></div>

  <header id="topbar">
    <div class="badge title-badge">🏝️ Agent Office</div>
    <div class="badge" id="connection-badge"><span id="connection-dot" class="dot"></span><span id="connection-label">connecting…</span></div>
    <button class="badge button-badge" id="toggle-log">📜 Log</button>
    <button class="badge button-badge" id="toggle-team">🍃 Team</button>
    <button class="badge button-badge" id="questions-button" hidden>❓ <span id="questions-count">0</span></button>
  </header>

  <aside id="log-panel" class="panel" hidden>
    <div class="panel-title row">
      <span>📜 Office log</span>
      <button id="copy-log" class="mini-button" title="Copy the whole log">📋 Copy</button>
    </div>
    <div id="log-lines"></div>
  </aside>

  <aside id="team-panel" class="panel" hidden>
    <div class="panel-title">🍃 Your team</div>
    <ul id="team-list"></ul>
    <form id="hire-form">
      <input id="hire-name" placeholder="Name" maxlength="32" autocomplete="off">
      <input id="hire-role" placeholder="Role (what are they like?)" maxlength="200" autocomplete="off">
      <button type="submit" class="chunky">➕ Hire</button>
    </form>
    <div class="team-file-row">
      <button id="save-team" class="chunky subtle">💾 Save team</button>
      <button id="load-team" class="chunky subtle">📂 Load team</button>
    </div>
  </aside>

  <div id="question-modal" class="modal" hidden>
    <div class="modal-card">
      <div class="panel-title" id="question-from">❓ Question</div>
      <p id="question-prompt"></p>
      <div id="question-choices"></div>
      <input id="question-custom" placeholder="…or write your own answer" autocomplete="off">
      <div class="modal-actions">
        <button id="question-later" class="chunky subtle">Later</button>
        <button id="question-submit" class="chunky">Answer!</button>
      </div>
    </div>
  </div>

  <div id="wiki-modal" class="modal" hidden>
    <div class="modal-card wiki-card">
      <div class="panel-title">📖 Office wiki</div>
      <div id="wiki-pages"></div>
      <div id="wiki-content" hidden>
        <div id="wiki-page-title" class="wiki-page-title"></div>
        <div id="wiki-page-meta" class="wiki-page-meta"></div>
        <div id="wiki-page-body"></div>
      </div>
      <div class="modal-actions">
        <button id="wiki-close" class="chunky subtle">Close</button>
      </div>
    </div>
  </div>

  <div id="board-modal" class="modal" hidden>
    <div class="modal-card board-card">
      <div class="panel-title">📌 Office board</div>
      <div id="board-columns"></div>
      <div class="modal-actions">
        <button id="board-close" class="chunky subtle">Close</button>
      </div>
    </div>
  </div>

  <form id="chat-bar">
    <button type="button" id="chat-target" class="chunky target">To: All 📣</button>
    <input id="chat-input" placeholder="Say something to the office… (click a villager to DM them)" autocomplete="off">
    <button type="submit" class="chunky">Send</button>
  </form>

  <div id="toast" hidden></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
